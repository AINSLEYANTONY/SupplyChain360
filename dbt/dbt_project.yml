name: supplychain360
version: "1.0.0"
config-version: 2
profile: supplychain360

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  supplier_rating_threshold: 3.5   # suppliers rated below this raise an alert
  shipment_delay_min_days: 1       # days late before a shipment raises an alert

models:
  supplychain360:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: gold
    quality:
      +materialized: table
      +schema: quality
    alerts:
      +materialized: table
      +schema: alerts